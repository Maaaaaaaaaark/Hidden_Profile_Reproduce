[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiddenbench"
version = "0.1.0"
description = "Benchmark and evaluation tools for collective reasoning under distributed information in multi-agent LLMs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Yuxuan Li" },
    { name = "Aoi Naito" },
    { name = "Hirokazu Shirado" }
]
keywords = [
    "multi-agent",
    "large-language-models",
    "benchmark",
    "collective-reasoning",
    "hidden-profile"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx[socks]>=0.23.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
hf = ["datasets>=2.19.0"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/Yassellee/HiddenBench"
Dataset = "https://huggingface.co/datasets/YuxuanLi1225/HiddenBench"

[project.scripts]
hiddenbench = "hiddenbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hiddenbench = ["data/*.json", "prompts/*.txt"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
